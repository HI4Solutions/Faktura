<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HI4 Faktura</title>
<style>
  :root { color-scheme: light dark; --bg:#f7f7f5; --fg:#1d2433; --dim:#5b6475; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171d; --fg:#e8eaee; --dim:#9aa3b2; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; }
  main { max-width:32rem; }
  h1 { font-size:2rem; margin:0 0 .5rem; }
  p { color:var(--dim); margin:0; }
</style>
</head>
<body>
<main>
  <h1>HI4 Faktura</h1>

</html>
