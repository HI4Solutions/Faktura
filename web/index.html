<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Lyst eller mørkt før siden tegnes: valget på denne enheten, ellers systemets (se tema.ts).
      try {
        var t = localStorage.getItem("faktura.tema");
        var mork = t === "mork" || (t !== "lys" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-tema", mork ? "mork" : "lys");
        document.querySelector('meta[name="color-scheme"]').setAttribute("content", mork ? "dark" : "light");
      } catch (e) {}
    </script>
    <title>HI4 Faktura</title>
    <meta name="description" content="Fakturering for norske bedrifter: send fakturaer, følg opp betalinger og få varsler." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/ikoner/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Faktura" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0d1530" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;700;750&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="statuslinje" aria-hidden="true"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
