name: Infrastruktur

# Plan på pull requests, apply på main. Logger inn i GCP med Workload Identity
# Federation (ingen nøkler). Variablene settes etter scripts/bootstrap-gcp.sh.

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  terraform:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_admin_eposter: ${{ vars.ADMIN_EPOSTER }}
      TF_VAR_google_oauth_client_id: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
      # AI (Gemini på Vertex AI): standardverdiene når variablene ikke er satt.
      TF_VAR_ai_aktiv: ${{ vars.AI_AKTIV || 'true' }}
      TF_VAR_ai_region: ${{ vars.AI_REGION || 'europe-west3' }}
      TF_VAR_ai_modell: ${{ vars.AI_MODELL || 'gemini-3.5-flash' }}
      TF_VAR_ai_grense: ${{ vars.AI_GRENSE || '1000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan
