name: Infrastruktur

# Plan på pull requests, apply på main (terraform.yml): først testflaten når den er satt opp, så
# produksjon, som venter på godkjenning når miljøet «produksjon» i GitHub krever det. Variablene
# settes etter scripts/bootstrap-gcp.sh (docs/miljoer.md).

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/miljoer.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/miljoer.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  miljoer:
    uses: ./.github/workflows/miljoer.yml

  test:
    needs: miljoer
    if: needs.miljoer.outputs.test == 'true'
    uses: ./.github/workflows/terraform.yml
    with:
      miljo: test

  # Etter testflaten, eller uten den når den ikke er satt opp.
  produksjon:
    needs: [miljoer, test]
    if: ${{ !cancelled() && vars.GCP_PROJECT_ID != '' && needs.miljoer.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    uses: ./.github/workflows/terraform.yml
    with:
      miljo: produksjon
