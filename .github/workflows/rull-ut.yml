name: Rull ut

# Bygger bildene, kjører databasemigreringene og ruller ut API, worker og nettappen i ett miljø:
# «test» (testflaten) eller «produksjon» i GitHub. Variablene i miljøet går foran dem i repoet, og
# produksjon venter på godkjenning når miljøet krever det (docs/miljoer.md). Kalles fra Utrulling.

on:
  workflow_call:
    inputs:
      miljo:
        description: "«test» eller «produksjon»"
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  rull-ut:
    runs-on: ubuntu-latest
    environment: ${{ inputs.miljo }}
    # Én utrulling om gangen per miljø. En ny venter på den forrige, også på godkjenningen; venter
    # flere, rulles bare den nyeste ut.
    concurrency:
      group: utrulling-${{ inputs.miljo }}
      cancel-in-progress: false
    env:
      REGION: ${{ vars.GCP_REGION }}
      PROSJEKT: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - name: Riktig miljø
        env:
          MILJO: ${{ vars.MILJO }}
          ONSKET: ${{ inputs.miljo }}
        run: |
          # Testflaten må ha sine egne variabler, og produksjon må aldri få testflatens.
          if [ "$ONSKET" = "test" ] && [ "$MILJO" != "test" ]; then echo "::error::Miljøet «test» har ikke MILJO=test."; exit 1; fi
          if [ "$ONSKET" != "test" ] && [ "$MILJO" = "test" ]; then echo "::error::Miljøet «$ONSKET» har MILJO=test."; exit 1; fi
          [ -n "$PROSJEKT" ] || { echo "::error::GCP_PROJECT_ID mangler."; exit 1; }
          echo "Ruller ut til prosjektet $PROSJEKT ($ONSKET)."

      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Bygg og last opp bildene
        run: |
          REG="$REGION-docker.pkg.dev/$PROSJEKT/faktura"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f server/Dockerfile -t "$REG/server:$GITHUB_SHA" .
          docker build -f db/Dockerfile -t "$REG/migrate:$GITHUB_SHA" .
          docker push "$REG/server:$GITHUB_SHA"
          docker push "$REG/migrate:$GITHUB_SHA"
          echo "REG=$REG" >> "$GITHUB_ENV"

      - name: Databasemigreringer
        run: |
          gcloud run jobs update faktura-migrate --region "$REGION" --image "$REG/migrate:$GITHUB_SHA" --quiet
          gcloud run jobs execute faktura-migrate --region "$REGION" --wait

      - name: Rull ut worker og API
        run: |
          gcloud run deploy faktura-worker --region "$REGION" --image "$REG/server:$GITHUB_SHA" --update-env-vars ROLLE=worker --quiet
          gcloud run deploy faktura-api --region "$REGION" --image "$REG/server:$GITHUB_SHA" --update-env-vars ROLLE=api --quiet

      - name: Røyktest
        run: |
          URL=$(gcloud run services describe faktura-api --region "$REGION" --format='value(status.url)')
          curl -fsS "$URL/helse"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Bygg nettappen
        working-directory: web
        run: npm ci && npm run build
      - name: Firebase Hosting
        working-directory: web
        run: |
          # Nettstedet heter som prosjektet (google_firebase_hosting_site i Terraform).
          jq --arg s "$PROSJEKT" '.hosting.site = $s' firebase.json > firebase.json.ny && mv firebase.json.ny firebase.json
          npx --yes firebase-tools@latest deploy --only hosting --project "$PROSJEKT" --non-interactive
