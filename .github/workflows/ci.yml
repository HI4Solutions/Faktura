name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database:
    name: Database- og servertester
    runs-on: ubuntu-latest
    services:
      postgres:
        # Fra AWS sitt speil av de offisielle bildene: Docker Hub har vært utilgjengelig fra GitHub.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      # psql finnes på GitHubs Ubuntu-maskiner; installer bare om den mangler (pakkekilden
      # kan henge, derfor tidsgrensen).
      - name: Installer psql
        timeout-minutes: 5
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - name: Kjør migreringer, database- og servertester
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/postgres
          TEST_URL_MAL: postgresql://%s@localhost:5432/faktura
          SERVER_TESTER: "1"
        run: scripts/test-db.sh

  web:
    name: Nettapp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  terraform:
    name: Terraform fmt og validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
