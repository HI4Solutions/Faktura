name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database:
    name: Databasetester
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Installer psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Kjør migreringer og tester
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/postgres
          TEST_URL_MAL: postgresql://%s@localhost:5432/faktura
        run: scripts/test-db.sh

  terraform:
    name: Terraform fmt og validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
