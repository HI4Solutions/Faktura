name: Utrulling

# Tester, og ruller så ut bildene, databasemigreringene, API, worker, nettappen og nettstedet
# (rull-ut.yml): først til testflaten når den er satt opp, så til produksjon. Produksjon venter på
# testflaten, og på godkjenning når miljøet «produksjon» i GitHub krever det (docs/miljoer.md).
# Kjører på main når server/, db/, web/ eller landingsside/ endres.

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "db/**"
      - "web/**"
      - "landingsside/**"
      - "scripts/migrer.sh"
      - "scripts/publiser-hosting.sh"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/rull-ut.yml"
      - ".github/workflows/miljoer.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Fra Googles speil av de offisielle bildene: Docker Hub har vært utilgjengelig fra GitHub, og
        # AWS sitt speil (public.ecr.aws) avviste nedlastingene («Data limit exceeded»).
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      # psql finnes på GitHubs Ubuntu-maskiner; installer bare om den mangler (pakkekilden
      # kan henge, derfor tidsgrensen).
      - name: Installer psql
        timeout-minutes: 5
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      # xmllint: SAF-T-filen valideres mot Skatteetatens XSD (server/test/saft.test.ts).
      - name: Installer xmllint
        timeout-minutes: 5
        run: command -v xmllint >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils)
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - name: Database- og servertester
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/postgres
          TEST_URL_MAL: postgresql://%s@localhost:5432/faktura
          SERVER_TESTER: "1"
        run: scripts/test-db.sh

  miljoer:
    uses: ./.github/workflows/miljoer.yml

  til-test:
    needs: [test, miljoer]
    if: needs.miljoer.outputs.test == 'true'
    uses: ./.github/workflows/rull-ut.yml
    with:
      miljo: test

  # Etter testflaten, eller uten den når den ikke er satt opp. Feiler testflaten eller sjekken av
  # den, rulles ikke produksjon ut.
  til-produksjon:
    needs: [test, miljoer, til-test]
    if: ${{ !cancelled() && vars.GCP_PROJECT_ID != '' && needs.test.result == 'success' && needs.miljoer.result == 'success' && (needs.til-test.result == 'success' || needs.til-test.result == 'skipped') }}
    uses: ./.github/workflows/rull-ut.yml
    with:
      miljo: produksjon
